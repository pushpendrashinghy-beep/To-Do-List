
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-list">

            <h2>To-Do List</h2>

            <form class="input-text" onsubmit="addTask(); return false;">
                <input type="text" placeholder="Add a new task" id="taskInput">
                <button type="submit">Add Task</button>
            </form>

            <ul id="taskList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
